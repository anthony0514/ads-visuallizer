<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ADS Visualizer</title>
<meta name="description" content="ADS 시각화 모음 — 순회 촬영 사각지대 기하 모델과 왕복 2장 전주 기울기 복원.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<style>
  html,body{height:100%}
  body{display:flex; flex-direction:column; overflow:hidden; background:var(--paper)}

  .appbar{
    flex:none; height:54px; display:flex; align-items:center; gap:20px;
    padding:0 16px; background:var(--surface); border-bottom:1px solid var(--rule);
  }
  .brand{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
    white-space:nowrap; flex:none;
  }
  .brand b{color:var(--ink); font-weight:600}

  .apptabs{display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none}
  .apptabs::-webkit-scrollbar{display:none}
  .apptab{
    font:inherit; font-family:var(--display); font-size:13.5px; font-weight:600;
    white-space:nowrap; padding:7px 14px; border-radius:999px;
    border:1px solid transparent; background:transparent; color:var(--ink-2);
    cursor:pointer; transition:background .12s, color .12s;
  }
  .apptab:hover{color:var(--ink); background:var(--surface-2)}
  .apptab[aria-selected="true"]{background:var(--blue); color:#fff}
  .apptab:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

  .spacer{flex:1}
  .out{
    font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--ink-2);
    text-decoration:none; flex:none; padding:6px 11px;
    border:1px solid var(--rule); border-radius:var(--r-sm);
  }
  .out:hover{color:var(--blue); border-color:var(--blue)}
  @media (max-width:640px){ .brand,.out{display:none} .apptabs{flex:1} }

  main{flex:1; position:relative; min-height:0; background:var(--paper)}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:var(--paper)}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">ADS <b>Visualizer</b></div>
  <nav class="apptabs" id="tabs" role="tablist" aria-label="시각화 목록"></nav>
  <div class="spacer"></div>
  <a class="out" id="raw" href="#" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
</div>

<main id="stage"></main>

<script>
(function(){
  var VIEWS = [
    { id:'blind-spot', label:'Blind Spot', file:'blind-spot.html', title:'ADS Blind Spot Simulator' },
    { id:'pole-tilt',  label:'전주 기울기', file:'pole_tilt.html',  title:'왕복 두 장으로 전주 기울기 복원' }
  ];

  var tabs = document.getElementById('tabs');
  var stage = document.getElementById('stage');
  var raw = document.getElementById('raw');
  var frames = {};

  VIEWS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'apptab';
    b.type = 'button';
    b.id = 'tab-' + v.id;
    b.textContent = v.label;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected','false');
    b.setAttribute('title', v.title);
    b.addEventListener('click', function(){ location.hash = v.id; });
    tabs.appendChild(b);
  });

  function show(id){
    var view = VIEWS.filter(function(v){ return v.id === id; })[0] || VIEWS[0];

    VIEWS.forEach(function(v){
      var sel = v.id === view.id;
      document.getElementById('tab-' + v.id).setAttribute('aria-selected', sel ? 'true' : 'false');
      if (frames[v.id]) frames[v.id].hidden = !sel;
    });

    if (!frames[view.id]) {
      var f = document.createElement('iframe');
      f.src = view.file;
      f.title = view.title;
      f.setAttribute('allow','fullscreen');
      stage.appendChild(f);
      frames[view.id] = f;
    }

    raw.href = view.file;
    document.title = view.title + ' — ADS Visualizer';
  }

  function fromHash(){ return (location.hash || '').replace(/^#/, '') || VIEWS[0].id; }

  window.addEventListener('hashchange', function(){ show(fromHash()); });
  show(fromHash());
})();
</script>
</body>
</html>
