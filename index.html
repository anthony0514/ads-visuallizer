<!doctype html>
<html lang="ko" data-lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ADS Visualizer</title>
<meta name="description" content="ADS 시각화 모음 — 순회 촬영 사각지대 기하 모델과 왕복 2장 전주 기울기 복원.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/theme.css">
<script src="assets/lang.js"></script>
<style>
  html,body{height:100%}
  body{display:flex; flex-direction:column; overflow:hidden; background:var(--paper)}

  .appbar{
    flex:none; height:54px; display:flex; align-items:center; gap:20px;
    padding:0 16px; background:var(--surface); border-bottom:1px solid var(--rule);
  }
  .brand{
    font-family:var(--mono); font-size:11px; font-weight:500;
    letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3);
    white-space:nowrap; flex:none;
  }
  .brand b{color:var(--ink); font-weight:600}

  .apptabs{display:flex; gap:4px; min-width:0; overflow-x:auto; scrollbar-width:none}
  .apptabs::-webkit-scrollbar{display:none}
  .apptab{
    font:inherit; font-family:var(--display); font-size:13.5px; font-weight:600;
    white-space:nowrap; padding:7px 14px; border-radius:999px;
    border:1px solid transparent; background:transparent; color:var(--ink-2);
    cursor:pointer; transition:background .12s, color .12s;
  }
  .apptab:hover{color:var(--ink); background:var(--surface-2)}
  .apptab[aria-selected="true"]{background:var(--blue); color:#fff}
  .apptab:focus-visible{outline:2px solid var(--blue); outline-offset:2px}

  .spacer{flex:1}
  @media (max-width:640px){ .brand{display:none} .apptabs{flex:1} }

  main{flex:1; position:relative; min-height:0; background:var(--paper)}
  iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block; background:var(--paper)}
</style>
</head>
<body>

<div class="appbar">
  <div class="brand">ADS <b>Visualizer</b></div>
  <nav class="apptabs" id="tabs" role="tablist" aria-label="Visualizations"></nav>
  <div class="spacer"></div>
  <div class="langtoggle" role="group" aria-label="Language / 언어">
    <button type="button" data-lang-set="en" aria-pressed="false">ENG</button>
    <button type="button" data-lang-set="ko" aria-pressed="true">한국어</button>
  </div>
</div>

<main id="stage"></main>

<script>
(function(){
  var VIEWS = [
    { id:'blind-spot', file:'blind-spot.html',
      label:{en:'Blind Spot', ko:'사각지대'},
      title:{en:'ADS Blind Spot Simulator', ko:'ADS 사각지대 시뮬레이터'} },
    { id:'pole-tilt',  file:'pole_tilt.html',
      label:{en:'Pole Tilt', ko:'전주 기울기'},
      title:{en:'Recovering pole tilt from a two-pass round trip', ko:'왕복 두 장으로 전주 기울기 복원'} }
  ];

  var tabs = document.getElementById('tabs');
  var stage = document.getElementById('stage');
  var frames = {}, active = null;

  VIEWS.forEach(function(v){
    var b = document.createElement('button');
    b.className = 'apptab';
    b.type = 'button';
    b.id = 'tab-' + v.id;
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected','false');
    b.addEventListener('click', function(){ location.hash = v.id; });
    tabs.appendChild(b);
  });

  function labels(){
    VIEWS.forEach(function(v){
      var b = document.getElementById('tab-' + v.id);
      b.textContent = ADSLang.t(v.label);
      b.title = ADSLang.t(v.title);
    });
    if(active) document.title = ADSLang.t(active.title) + ' — ADS Visualizer';
  }

  function show(id){
    var view = VIEWS.filter(function(v){ return v.id === id; })[0] || VIEWS[0];
    active = view;

    VIEWS.forEach(function(v){
      var sel = v.id === view.id;
      document.getElementById('tab-' + v.id).setAttribute('aria-selected', sel ? 'true' : 'false');
      if (frames[v.id]) frames[v.id].hidden = !sel;
    });

    if (!frames[view.id]) {
      var f = document.createElement('iframe');
      f.src = view.file;
      f.setAttribute('allow','fullscreen');
      f.addEventListener('load', function(){
        try{ f.contentWindow.postMessage({ads_lang: ADSLang.get()}, '*'); }catch(e){}
      });
      stage.appendChild(f);
      frames[view.id] = f;
    }
    labels();
  }

  function fromHash(){ return (location.hash || '').replace(/^#/, '') || VIEWS[0].id; }

  ADSLang.on(labels);
  ADSLang.bind(document);
  window.addEventListener('hashchange', function(){ show(fromHash()); });
  show(fromHash());
})();
</script>
</body>
</html>
